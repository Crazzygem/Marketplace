<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>User Management</h2>
    <button class="btn btn-sm btn-outline-secondary" (click)="loadUsers()">Refresh</button>
  </div>

  <!-- Alert Messages -->
  <app-alert
    *ngIf="alert"
    [variant]="alert.variant"
    [title]="alert.title"
    [description]="alert.description"
    [showIcon]="true">
  </app-alert>

  <!-- Skeleton Loading State -->
  <div *ngIf="isLoading" class="skeleton-table">
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th><app-skeleton width="2rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="5rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="8rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="4rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="4rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="5rem" height="1rem"></app-skeleton></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let _ of [0, 1, 2, 3, 4, 5, 6, 7]">
          <td><app-skeleton width="2rem" height="1rem"></app-skeleton></td>
          <td><app-skeleton width="8rem" height="1rem"></app-skeleton></td>
          <td><app-skeleton width="12rem" height="1rem"></app-skeleton></td>
          <td><app-skeleton width="4rem" height="1.25rem"></app-skeleton></td>
          <td><app-skeleton width="4rem" height="1.25rem"></app-skeleton></td>
          <td><app-skeleton width="5rem" height="2rem"></app-skeleton></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- User Table -->
  <table class="table table-hover table-bordered" *ngIf="!isLoading">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
          <app-badge
            [text]="getUserRole(user)"
            [variant]="getRoleVariant(getUserRole(user))">
          </app-badge>
        </td>
        <td>
          <app-badge
            [text]="user.is_banned ? 'Banned' : 'Active'"
            [variant]="getStatusVariant(getUserRole(user), user.is_banned)">
          </app-badge>
        </td>
        <td>
          <div class="d-flex gap-1">
            <button class="btn btn-sm"
              [ngClass]="user.is_banned ? 'btn-outline-success' : 'btn-outline-danger'"
              (click)="toggleBan(user)">
              <i class="fas" [ngClass]="user.is_banned ? 'fa-check me-1' : 'fa-ban me-1'"></i>
              {{ user.is_banned ? 'Unban' : 'Ban' }}
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteUser(user)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
