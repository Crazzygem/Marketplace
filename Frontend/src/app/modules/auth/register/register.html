<div class="container-fluid px-0">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8 col-sm-10">
        <div class="card shadow-lg border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold">Create Account</h2>
              <p class="text-muted">Join our marketplace today</p>
            </div>

            <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
              <div class="row">
                <div class="col-md-6 mb-4">
                  <label for="name" class="form-label">Full Name</label>
                  <input
                    [(ngModel)]="formData.name"
                    name="name"
                    type="text"
                    class="form-control form-control-lg"
                    id="name"
                    placeholder="Enter your full name"
                    required>
                </div>

                <div class="col-md-6 mb-4">
                  <label for="email" class="form-label">Email Address</label>
                  <input
                    [(ngModel)]="formData.email"
                    name="email"
                    type="email"
                    class="form-control form-control-lg"
                    id="email"
                    placeholder="Enter your email"
                    required>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                  [(ngModel)]="formData.password"
                  name="password"
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  placeholder="Create a strong password"
                  required>
                <div class="form-text">
                  Password must be at least 6 characters long
                </div>
              </div>

              <div class="mb-4">
                <label for="role" class="form-label">Account Type</label>
                <select
                  [(ngModel)]="formData.role"
                  name="role"
                  class="form-select form-select-lg"
                  id="role"
                  required>
                  <option value="" disabled>Select account type</option>
                  <option value="customer">Customer</option>
                  <option value="shop_owner">Shop Owner</option>
                  <!-- Admin role usually not public, but added for testing -->
                  <option value="admin">Admin</option>
                </select>
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="terms" required>
                  <label class="form-check-label" for="terms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                  </label>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-success btn-lg w-100 mb-3"
                [disabled]="!registerForm.form.valid">
                Create Account
              </button>

              <div class="text-center">
                <p class="mb-0">Already have an account?
                  <a routerLink="/auth/login" class="text-decoration-none">Sign in here</a>
                </p>
              </div>
            </form>

            <div class="divider mt-4 mb-4">
              <div class="divider-line"></div>
              <span class="px-3 text-muted">or continue with</span>
              <div class="divider-line"></div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-outline-google btn-lg">
                <i class="fab fa-google me-2"></i> Sign up with Google
              </button>
              <button class="btn btn-outline-facebook btn-lg">
                <i class="fab fa-facebook-f me-2"></i> Sign up with Facebook
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
