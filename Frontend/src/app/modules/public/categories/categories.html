<div class="container py-4">
  <h1>Categories</h1>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && categories.length === 0" class="text-center py-5">
    <h4>No categories found</h4>
    <p>There are currently no categories available.</p>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" *ngIf="!loading && categories.length > 0">
    <div class="col" *ngFor="let category of categories">
      <div class="card h-100 category-card" (click)="viewCategory(category.category_id)" style="cursor: pointer;">
        <div class="card-body d-flex flex-column">
          <div class="category-icon mb-3">
            <i class="fas {{ category.icon || 'fa-tag' }} fa-2x"></i>
          </div>
          <h5 class="card-title">{{ category.category_name }}</h5>
          <p class="card-text text-muted">{{ category.description }}</p>
          <div class="mt-auto">
            <small class="text-muted">{{ category.listings_count || 0 }} items</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Back to Home Button -->
  <div class="mt-4">
    <button class="btn btn-primary" routerLink="/public/home">Back to Home</button>
  </div>
</div>
