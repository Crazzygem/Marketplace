<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Staff Management</h2>
    <button class="btn btn-sm btn-outline-secondary" (click)="loadUsers()">Refresh</button>
  </div>

  <!-- Alert Messages -->
  <app-alert
    *ngIf="alert"
    [variant]="alert.variant"
    [title]="alert.title"
    [description]="alert.description"
    [showIcon]="true">
  </app-alert>

  <!-- Search and Filter -->
  <div class="row mb-3">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text">
          <i class="fas fa-magnifying-glass"></i>
        </span>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search by name or email..." 
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchInput()">
      </div>
    </div>
    <div class="col-md-6 text-end">
      <span class="text-muted">
        Showing {{ filteredUsers.length }} of {{ users.length }} users
      </span>
    </div>
  </div>

  <!-- Skeleton Loading State -->
  <div *ngIf="isLoading" class="skeleton-table">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th><app-skeleton width="2rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="5rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="8rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="4rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="4rem" height="1rem"></app-skeleton></th>
          <th><app-skeleton width="10rem" height="1rem"></app-skeleton></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let _ of [0, 1, 2, 3, 4, 5, 6, 7]">
          <td><app-skeleton width="2rem" height="1rem"></app-skeleton></td>
          <td><app-skeleton width="8rem" height="1rem"></app-skeleton></td>
          <td><app-skeleton width="12rem" height="1rem"></app-skeleton></td>
          <td><app-skeleton width="4rem" height="1.25rem"></app-skeleton></td>
          <td><app-skeleton width="4rem" height="1.25rem"></app-skeleton></td>
          <td><app-skeleton width="10rem" height="2rem"></app-skeleton></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Staff Table -->
  <table class="table table-hover table-bordered" *ngIf="!isLoading">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="filteredUsers.length === 0">
        <td colspan="6" class="text-center py-4">
          <app-empty-state
            icon="fa-users"
            title="No Users Found"
            [description]="
              searchTerm
                ? 'No users match your search criteria.'
                : 'No users available in the system.'
            "
          ></app-empty-state>
        </td>
      </tr>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.id }}</td>
        <td>
          <div class="d-flex align-items-center">
            <div class="avatar avatar-sm me-2">
              <span>{{ user.name.charAt(0).toUpperCase() }}</span>
            </div>
            <strong>{{ user.name }}</strong>
          </div>
        </td>
        <td>{{ user.email }}</td>
        <td>
          <app-badge
            [text]="getUserRole(user)"
            [variant]="getRoleVariant(getUserRole(user))">
          </app-badge>
        </td>
        <td>
          <app-badge
            [text]="user.is_banned ? 'Banned' : 'Active'"
            [variant]="getStatusVariant(getUserRole(user), user.is_banned)">
          </app-badge>
        </td>
        <td>
          <div class="btn-group" role="group">
            <button 
              class="btn btn-sm"
              [ngClass]="isStaff(user) ? 'btn-outline-warning' : 'btn-outline-success'"
              (click)="toggleStaffRole(user)"
              title="{{ isStaff(user) ? 'Remove staff role' : 'Assign staff role' }}">
              <i class="fas" [ngClass]="isStaff(user) ? 'fa-user-xmark' : 'fa-user-check'"></i>
              {{ isStaff(user) ? 'Remove Staff' : 'Make Staff' }}
            </button>
            <button 
              class="btn btn-sm"
              [ngClass]="user.is_banned ? 'btn-outline-success' : 'btn-outline-danger'"
              (click)="toggleBan(user)"
              title="{{ user.is_banned ? 'Unban user' : 'Ban user' }}">
              <i class="fas" [ngClass]="user.is_banned ? 'fa-unlock' : 'fa-ban'"></i>
              {{ user.is_banned ? 'Unban' : 'Ban' }}
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Info -->
  <div class="mt-3" *ngIf="!isLoading && filteredUsers.length > 0">
    <small class="text-muted">
      Displaying {{ filteredUsers.length }} user(s)
    </small>
  </div>
</div>
