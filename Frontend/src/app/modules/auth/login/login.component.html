<div class="container-fluid px-0">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-6 col-sm-8">
        <div class="card shadow-lg border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold">Welcome Back</h2>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <!-- Error Alert -->
            @if (errorMessage()) {
              <app-alert
                variant="danger"
                [title]="'Login Error'"
                [description]="errorMessage()!"
                [showIcon]="true"
              >
              </app-alert>
            }

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
              <div class="mb-4">
                <label for="email" class="form-label">Email Address</label>
                <input
                  [(ngModel)]="email"
                  name="email"
                  type="email"
                  class="form-control form-control-lg"
                  [class.is-invalid]="!isEmailValid() && email().length > 0"
                  [class.is-valid]="isEmailValid() && email().length > 0"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
                @if (!isEmailValid() && email().length > 0) {
                  <div class="invalid-feedback d-block">Please enter a valid email address</div>
                }
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="password" class="form-label">Password</label>
                  <a href="#" class="text-decoration-none small">Forgot password?</a>
                </div>
                <div class="input-group">
                  <input
                    [(ngModel)]="password"
                    name="password"
                    [type]="showPassword() ? 'text' : 'password'"
                    class="form-control form-control-lg"
                    [class.is-invalid]="!isPasswordValid() && password().length > 0"
                    [class.is-valid]="isPasswordValid() && password().length > 0"
                    id="password"
                    placeholder="Enter your password"
                    required
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary input-group-text"
                    (click)="togglePassword()"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                  >
                    <i
                      class="fas"
                      [class.fa-eye]="!showPassword()"
                      [class.fa-eye-slash]="showPassword()"
                    ></i>
                  </button>
                </div>
                @if (!isPasswordValid() && password().length > 0) {
                  <div class="invalid-feedback d-block">Password must be at least 6 characters</div>
                }
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" />
                  <label class="form-check-label" for="rememberMe"> Remember me </label>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-lg w-100 mb-3"
                [disabled]="!isFormValid() || isSubmitting()"
              >
                @if (isSubmitting()) {
                  <span
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                    aria-hidden="true"
                  ></span>
                  Signing in...
                } @else {
                  Sign In
                }
              </button>

              <div class="text-center">
                <p class="mb-0">
                  Don't have an account?
                  <a routerLink="/auth/register" class="text-decoration-none">Register here</a>
                </p>
              </div>
            </form>


          </div>
        </div>
      </div>
    </div>
  </div>
</div>
