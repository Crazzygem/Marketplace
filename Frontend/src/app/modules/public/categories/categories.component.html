<div class="container py-4">
  <h2 class="fw-bold">Categories</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" *ngIf="loading">
    <div class="col" *ngFor="let item of [1, 2, 3, 4, 5, 6]">
      <div class="card h-100">
        <div class="card-body">
          <app-skeleton height="80px" width="100%" class="mb-3"></app-skeleton>
          <app-skeleton height="1.5rem" width="60%" class="mb-2"></app-skeleton>
          <app-skeleton height="1rem" width="90%"></app-skeleton>
        </div>
      </div>
    </div>
  </div>

  <app-empty-state
    *ngIf="!loading && categories.length === 0"
    icon="fa-tags"
    title="No categories found"
    description="There are currently no categories available.">
  </app-empty-state>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" *ngIf="!loading && categories.length > 0">
    <div class="col" *ngFor="let category of categories">
      <div class="card h-100 category-card cursor-pointer" (click)="viewCategory(category.category_id)">
        <div class="card-body d-flex flex-column">
          <div class="category-icon mb-3">
            <i class="fas {{ category.icon || 'fa-tag' }} fa-2x"></i>
          </div>
          <h5 class="card-title">{{ category.category_name }}</h5>
          <p class="card-text text-muted">{{ category.description }}</p>
          <div class="mt-auto">
            <small class="text-muted">{{ category.listings_count || 0 }} items</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Back to Home Button -->
  <div class="mt-4">
    <button class="btn btn-primary" routerLink="/public/home">Back to Home</button>
  </div>
</div>
