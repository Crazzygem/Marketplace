<div class="container py-4">
  <h2>Moderation Queue</h2>

  <!-- Alert Messages -->
  <div class="mt-3" *ngIf="alert() as alert">
    <app-alert
      [variant]="alert.variant"
      [title]="alert.title"
      [description]="alert.description"
      [showIcon]="true">
    </app-alert>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="mt-3">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Reporter</th>
          <th>Target</th>
          <th>Reason</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of [1, 2, 3, 4, 5, 6, 7, 8]">
          <td><app-skeleton [height]="'1.5rem'" [width]="'60px'"></app-skeleton></td>
          <td><app-skeleton [height]="'1.5rem'" [width]="'120px'"></app-skeleton></td>
          <td><app-skeleton [height]="'1.5rem'" [width]="'100px'"></app-skeleton></td>
          <td><app-skeleton [height]="'1.5rem'" [width]="'150px'"></app-skeleton></td>
          <td><app-skeleton [height]="'1.5rem'" [width]="'80px'"></app-skeleton></td>
          <td><app-skeleton [height]="'2rem'" [width]="'100px'"></app-skeleton></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Reports Table -->
  <table class="table table-striped mt-3" *ngIf="!isLoading()">
    <thead>
      <tr>
        <th>ID</th>
        <th>Reporter</th>
        <th>Target</th>
        <th>Reason</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let report of reports">
        <td>{{ report.id }}</td>
        <td>{{ report.reporter?.name || report.reporter }}</td>
        <td>{{ report.reportedItem }}</td>
        <td>{{ report.reason }}</td>
        <td>
          <app-badge
            [text]="report.status"
            [variant]="getStatusVariant(report.status)">
          </app-badge>
        </td>
        <td>
          <button *ngIf="report.status === 'pending'"
                  class="btn btn-sm btn-primary"
                  (click)="resolve(report)">
            Mark Resolved
          </button>
          <span *ngIf="report.status === 'resolved'" class="text-muted">No Action</span>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Empty State -->
  <div *ngIf="!isLoading() && reports.length === 0" class="text-center mt-5">
    <app-alert
      [variant]="'info'"
      [title]="'No Reports'"
      [description]="'There are no reports in the moderation queue at this time.'"
      [showIcon]="true">
    </app-alert>
  </div>
</div>
