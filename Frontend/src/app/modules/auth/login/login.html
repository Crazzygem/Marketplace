<div class="container-fluid px-0">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-6 col-sm-8">
        <div class="card shadow-lg border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold">Welcome Back</h2>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
              <div class="mb-4">
                <label for="email" class="form-label">Email Address</label>
                <input
                  [(ngModel)]="email"
                  name="email"
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  placeholder="Enter your email"
                  required>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="password" class="form-label">Password</label>
                  <a href="#" class="text-decoration-none small">Forgot password?</a>
                </div>
                <div class="input-group">
                  <input
                    [(ngModel)]="password"
                    name="password"
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control form-control-lg"
                    id="password"
                    placeholder="Enter your password"
                    required>
                  <button
                    type="button"
                    class="btn btn-outline-secondary input-group-text"
                    (click)="togglePassword()"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                    <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                  </button>
                </div>
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">
                    Remember me
                  </label>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-lg w-100 mb-3"
                [disabled]="!loginForm.form.valid">
                Sign In
              </button>

              <div class="text-center">
                <p class="mb-0">Don't have an account?
                  <a routerLink="/auth/register" class="text-decoration-none">Register here</a>
                </p>
              </div>
            </form>

            <div class="divider mt-4 mb-4">
              <div class="divider-line"></div>
              <span class="px-3 text-muted">or continue with</span>
              <div class="divider-line"></div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-outline-google btn-lg">
                <i class="fab fa-google me-2"></i> Sign in with Google
              </button>
              <button class="btn btn-outline-facebook btn-lg">
                <i class="fab fa-facebook-f me-2"></i> Sign in with Facebook
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
