<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Staff Management</h2>
    <button class="btn btn-sm btn-primary">Add New Staff</button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let staff of staffList">
              <td>{{ staff.user.name }}</td>
              <td>{{ staff.user.email }}</td>
              <td>{{ staff.role }}</td>
              <td>
                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="removeStaff(staff.member_id)"
                >
                  Remove
                </button>
              </td>
            </tr>
            <tr *ngIf="staffList.length === 0">
              <td colspan="4" class="text-center py-4">No staff members found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
